<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentOps SDK</title>
    <meta name="description" content="AgentOps SDK by Manas Vardhan: seven small, open-source Python packages covering the full lifecycle of LLM agents, from building and benchmarking to guardrails, tracing, failure monitoring and cost control." />
    <meta name="theme-color" content="#14151a" />
    <meta property="og:title" content="AgentOps SDK" />
    <meta property="og:description" content="A modular toolkit for the full lifecycle of LLM agents. Seven packages on PyPI." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("agentops-theme");
          if (t === "light") {
            document.documentElement.classList.remove("dark");
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
